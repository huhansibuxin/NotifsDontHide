name: Build NotifsDontHide

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        variant: [rootless, roothide]
    runs-on: macos-14
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (Roothide)
        if: matrix.variant == 'roothide'
        run: |
          git clone --recurse-submodules https://github.com/roothide/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=roothide" >> $GITHUB_ENV

      - name: Setup Theos (Rootless)
        if: matrix.variant != 'roothide'
        run: |
          git clone --recurse-submodules https://github.com/theos/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV

      - name: Install dependencies
        run: brew install dpkg ldid

      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          curl -sLO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf sdks-master master.zip

      - name: Build
        run: make package 2>&1 | tee build.log

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NotifsDontHide-${{ matrix.variant }}
          path: packages/*.deb

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NotifsDontHide-buildlog-${{ matrix.variant }}
          path: build.log
