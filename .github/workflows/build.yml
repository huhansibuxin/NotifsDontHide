name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install SDK
        run: |
          curl -L -o $THEOS/sdks/master.zip https://github.com/theos/sdks/archive/master.zip
          unzip -o $THEOS/sdks/master.zip -d $THEOS/sdks/
          cp -r $THEOS/sdks/sdks-master/iPhoneOS16.5.sdk $THEOS/sdks/
          rm -rf $THEOS/sdks/sdks-master $THEOS/sdks/master.zip

      - name: Build
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: NotifsDontHide
          path: packages/*.deb
